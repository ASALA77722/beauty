name: Créer la structure du serveur Discord

on:
  workflow_dispatch:
    inputs:
      guild_id:
        description: 'Identifiant du serveur Discord'
        required: false
      bot_token:
        description: 'Jeton du bot (laisser vide si le secret existe)'
        required: false

jobs:
  creer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Créer catégories, salons, rôles et textes
        env:
          DISCORD_BOT_TOKEN: ${{ inputs.bot_token || secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ inputs.guild_id || secrets.DISCORD_GUILD_ID }}
        run: |
          node scripts/creer-serveur.mjs 2>&1 | tee /tmp/sortie.txt
          echo '### Resultat' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 /tmp/sortie.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
