name: Déployer le site sur GitHub Pages

on:
  push:
    branches:
      - arena/0db78c3a-beaut
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        env:
          # Si un domaine personnalisé est défini (public/CNAME), le site est servi
          # à la racine du domaine. Sinon on utilise le chemin /<nom-du-dépôt>/.
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -f public/CNAME ]; then
            echo "Domaine personnalisé détecté : $(cat public/CNAME)"
            PAGES_BASE=/ npm run build
          else
            echo "Pas de domaine personnalisé → /$REPO_NAME/"
            PAGES_BASE=/$REPO_NAME/ npm run build
          fi
          # copie le CNAME dans le build (GitHub Pages l'exige)
          if [ -f public/CNAME ]; then cp public/CNAME dist/CNAME; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
