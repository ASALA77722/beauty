name: Déployer le site sur GitHub Pages

on:
  push:
    branches:
      - arena/0db78c3a-beaut
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-enabled: ${{ steps.pages-check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        env:
          PAGES_BASE: /Beaut-/
        run: npm run build

      - name: Vérifier si GitHub Pages est activé
        id: pages-check
        run: |
          # Pages doit être activé une fois manuellement (Settings → Pages → Source : GitHub Actions)
          if curl -sf -H "Authorization: Bearer ${{ github.token }}" \
             "${{ github.api_url }}/repos/${{ github.repository }}/pages" > /dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages n'est pas encore activé. Settings → Pages → Source : « GitHub Actions »."
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages-check.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages-check.outputs.enabled == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages-enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
